name: Weekly maintenance

# Lower-cadence pass: refresh slow-moving fundamentals + the "due diligence"
# sources (SEC EDGAR, Screener.in, NSE FII/DII, corporate announcements, SEBI
# PIT disclosures), then (cheaply) train the per-regime LightGBM models.
# Runs scripts/run_weekly.py — no Prefect/Docker.

on:
  schedule:
    # 03:30 UTC every Sunday — markets shut, a quiet window for the training pass.
    - cron: "30 3 * * 0"
  workflow_dispatch:
    inputs:
      skip_training:
        description: "Skip the LightGBM training pass (true/false)."
        required: false
        default: "false"

# Share the pipeline concurrency group so weekly never overlaps daily/backfill.
concurrency:
  group: pfip-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly:
    name: Weekly fundamentals + diligence + training
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      # --- Database (REQUIRED) ---
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # --- Data-source API keys (all OPTIONAL; absent → that source no-ops) ---
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      NASDAQ_DATA_LINK_API_KEY: ${{ secrets.NASDAQ_DATA_LINK_API_KEY }}
      SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
      GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
      NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
      MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      APP_ENV: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply DB migrations (idempotent)
        run: alembic upgrade head

      - name: Run weekly maintenance
        run: |
          if [ "${{ github.event.inputs.skip_training }}" = "true" ]; then
            python -m scripts.run_weekly --skip-training
          else
            python -m scripts.run_weekly
          fi
