name: Daily ingest

# Always-on cloud pipeline: GitHub Actions is the scheduler + compute, Neon is
# the managed Postgres. Runs scripts/run_daily_pipeline.py (no Prefect/Docker)
# against DATABASE_URL. See docs/CLOUD_MIGRATION.md for the runbook.

on:
  schedule:
    # Times are UTC (GitHub cron has no TZ). Both run Mon–Fri only.
    # 22:30 UTC — ~30 min after the US cash close (16:00 ET / 20:00–21:00 UTC),
    # so Tiingo EOD bars for the tracked US tickers are published.
    - cron: "30 22 * * 1-5"
    # 12:30 UTC — ~1h after the NSE/BSE close (15:30 IST = 10:00 UTC), giving
    # jugaad time to publish the day's NSE EOD for the NIFTY-50 watchlist.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      stages:
        description: "Comma-separated stages (ingest,features,regime,signals,retention). Blank = all."
        required: false
        default: ""

# Never let two daily runs overlap on the same DB (the 2 crons + a manual
# dispatch could collide). Queue, don't cancel — a half-finished ingest that
# gets cancelled is worse than a short wait.
concurrency:
  group: pfip-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily:
    name: Run daily pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      # --- Database (REQUIRED) ---
      # Neon async URL: postgresql+psycopg://USER:PASS@HOST/DB?sslmode=require
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # --- Data-source API keys (all OPTIONAL; absent → that source no-ops) ---
      # OHLCV
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      # Fundamentals
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      NASDAQ_DATA_LINK_API_KEY: ${{ secrets.NASDAQ_DATA_LINK_API_KEY }}
      # SEC EDGAR requires a UA in the form "Name email" (no key); a URL-style UA
      # gets 403'd by SEC's WAF.
      SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
      # Macro / commodities
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      # Crypto on-chain / news
      CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
      GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
      # General news / social
      NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
      MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      # Run outside dev so config.py enforces real DB credentials (no insecure
      # defaults). PFIP_PIPELINE_MODE skips the web-auth secret check — this is a
      # headless ingest job with no login surface (DB strictness still applies).
      APP_ENV: prod
      PFIP_PIPELINE_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply DB migrations (idempotent; guarded for plain Postgres/Neon)
        run: alembic upgrade head

      - name: Run daily pipeline
        run: |
          if [ -n "${{ github.event.inputs.stages }}" ]; then
            python -m scripts.run_daily_pipeline --stages "${{ github.event.inputs.stages }}"
          else
            python -m scripts.run_daily_pipeline
          fi
