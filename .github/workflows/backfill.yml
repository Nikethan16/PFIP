name: Backfill history

# One-time (or rare) seed of a FRESH Neon DB with ~3 years of history. Run this
# manually right after creating the Neon project, BEFORE relying on daily-ingest.
# It re-pulls from the free upstream sources (no Timescale dump/restore).
# See docs/CLOUD_MIGRATION.md step (c).

on:
  workflow_dispatch:
    inputs:
      days:
        description: "History depth in days (~1200 ≈ 3 years)."
        required: false
        default: "1200"
      skip_compute:
        description: "Seed OHLCV/FX only; skip features/regime/signals (true/false)."
        required: false
        default: "false"

# Never run a backfill concurrently with a daily ingest on the same DB.
concurrency:
  group: pfip-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    name: Seed ~3y history
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    env:
      # --- Database (REQUIRED) ---
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # --- Data-source API keys (all OPTIONAL; absent → that source no-ops) ---
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      NASDAQ_DATA_LINK_API_KEY: ${{ secrets.NASDAQ_DATA_LINK_API_KEY }}
      SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
      GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
      NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
      MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      APP_ENV: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply DB migrations (creates the schema on the fresh Neon DB)
        run: alembic upgrade head

      - name: Backfill ~3y history
        run: |
          ARGS="--days ${{ github.event.inputs.days }}"
          if [ "${{ github.event.inputs.skip_compute }}" = "true" ]; then
            ARGS="$ARGS --skip-compute"
          fi
          python -m scripts.backfill_history $ARGS
