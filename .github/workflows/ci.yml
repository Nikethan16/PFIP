name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Black (format check)
        run: uv run black --check .

      - name: Mypy (type check)
        run: uv run mypy pfip

      - name: Pytest
        run: uv run pytest -q

  frontend-lint-test:
    name: Frontend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  compose-smoke:
    name: docker compose — config smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seed .env from example
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml config > /dev/null

  backend-integration:
    name: Backend — real-DB integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A real Postgres service container. The integration conftest prefers
    # DATABASE_URL when present (this service) and only falls back to
    # testcontainers/Docker when it's unset — so CI exercises the real-DB suite
    # without Docker-in-Docker.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pfip
          POSTGRES_PASSWORD: pfip_test
          POSTGRES_DB: pfip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pfip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Async psycopg3 URL — the integration conftest normalizes this form.
      DATABASE_URL: postgresql+psycopg://pfip:pfip_test@localhost:5432/pfip_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies (+ testcontainers)
        run: |
          uv sync --all-extras --dev
          uv pip install "testcontainers[postgres]==4.7.2"

      - name: Run integration tests (-m integration)
        run: uv run pytest -m integration -q -p no:warnings

  security-scan:
    name: Security — deps & secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history to scan commits

      # --- Backend dependency vulnerability scan -------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend deps)
        # Blocking on HIGH+ vulnerabilities. pip-audit exits non-zero when a
        # known-vulnerable package is found; that fails the job by design.
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --strict

      # --- Frontend dependency vulnerability scan ------------------------------
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: pnpm audit (frontend deps, high+)
        working-directory: frontend
        run: pnpm audit --audit-level=high

      # --- Secret scan ---------------------------------------------------------
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
