name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # requirements.txt is the single source of truth (runtime + dev tools) and
      # is what the cloud-ingest workflows install too. The pyproject's
      # [project.dependencies] is only a runtime subset, so `uv sync` would miss
      # the ML/test deps — install the full pinned set with pip instead.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Ruff + mypy are ADVISORY for this solo project: the codebase predates a
      # strict lint/type config, so they surface style/type debt without blocking.
      # Black (formatting) + Pytest (tests) remain hard gates.
      - name: Ruff (lint, advisory)
        run: ruff check .
        continue-on-error: true

      - name: Black (format check)
        run: black --check .

      - name: Mypy (type check, advisory)
        run: mypy pfip
        continue-on-error: true

      - name: Pytest
        run: pytest -q

  frontend-lint-test:
    name: Frontend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ESLint is advisory (style debt); Typecheck (tsc) is the hard gate that
      # guarantees type safety. Vitest is advisory for now (suite still maturing).
      - name: Lint (advisory)
        run: pnpm lint
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (advisory)
        run: pnpm test
        continue-on-error: true

  compose-smoke:
    name: docker compose — config smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seed .env from example
        run: cp .env.example .env

      - name: Validate compose file
        # With `-f infra/...`, Compose resolves its project directory to `infra/`
        # and would look for `infra/.env`; point it at the root `.env` we seeded
        # so the `${POSTGRES_PASSWORD:?...}` interpolation finds a value.
        run: docker compose --env-file .env -f infra/docker-compose.yml config > /dev/null

  backend-integration:
    name: Backend — real-DB integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A real Postgres service container. The integration conftest prefers
    # DATABASE_URL when present (this service) and only falls back to
    # testcontainers/Docker when it's unset — so CI exercises the real-DB suite
    # without Docker-in-Docker.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pfip
          POSTGRES_PASSWORD: pfip_test
          POSTGRES_DB: pfip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pfip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Async psycopg3 URL — the integration conftest normalizes this form.
      DATABASE_URL: postgresql+psycopg://pfip:pfip_test@localhost:5432/pfip_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (+ testcontainers)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "testcontainers[postgres]==4.7.2"

      - name: Run integration tests (-m integration, advisory)
        # DATABASE_URL points at the localhost service container (a throwaway), so
        # the destructive-DB safety gate in tests/integration/_harness.py allows it.
        run: pytest -m integration -q -p no:warnings
        continue-on-error: true

  security-scan:
    name: Security — deps & secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history to scan commits

      # --- Backend dependency vulnerability scan -------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend deps, advisory)
        # Advisory: surfaces known-vulnerable deps without blocking the build.
        # Review the report and bump as needed.
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --strict

      # --- Frontend dependency vulnerability scan ------------------------------
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: pnpm audit (frontend deps, high+, advisory)
        working-directory: frontend
        continue-on-error: true
        run: pnpm audit --audit-level=high

      # --- Secret scan (advisory) ----------------------------------------------
      - name: Gitleaks (secret scan, advisory)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
