version: "3.9"

# PFIP local stack — one setup, one database.
# Data lives in Neon (cloud Postgres). Docker runs everything else.
#
# Start:  docker compose -f infra/docker-compose.yml --env-file .env up -d
# Stop:   docker compose -f infra/docker-compose.yml down
#
# DATABASE_URL in .env must point at your Neon project:
#   postgresql+psycopg://USER:PASS@HOST/DB?sslmode=require
# The same URL is used here (local dev) AND in GitHub Actions (daily ingest) —
# one database, no sync problems.

name: pfip

networks:
  pfip-net:
    driver: bridge

volumes:
  redis_data:
  qdrant_data:
  mlflow_data:
  ollama_data:
  uptime_kuma_data:

services:
  # -------- Cache / rate-limit layer --------
  redis:
    image: redis:7.2-alpine
    container_name: pfip-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [pfip-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------- Vector store (RAG) --------
  qdrant:
    image: qdrant/qdrant:v1.9.3
    container_name: pfip-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [pfip-net]
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q '200'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # -------- ML experiment tracking --------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.0
    container_name: pfip-mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    networks: [pfip-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # -------- Local LLM --------
  ollama:
    image: ollama/ollama:0.30.4
    container_name: pfip-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks: [pfip-net]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # On first run, pull the models:
    #   docker exec -it pfip-ollama ollama pull mistral:7b-instruct
    #   docker exec -it pfip-ollama ollama pull nomic-embed-text

  # -------- Observability --------
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: pfip-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks: [pfip-net]

  # -------- PFIP app services --------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: pfip-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # DATABASE_URL comes from .env — the Neon cloud Postgres URL.
      # No local DB container needed; same URL as GitHub Actions uses.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env — use your Neon connection string}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OLLAMA_HOST: http://ollama:11434
      APP_ENV: dev
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../backend:/app
    depends_on:
      redis:
        condition: service_healthy
    networks: [pfip-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: prod
    container_name: pfip-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
      BACKEND_URL: http://backend:8000/api/v1
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in .env}
      NEXTAUTH_URL: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks: [pfip-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
