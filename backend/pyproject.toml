[project]
name = "pfip"
version = "0.1.0"
description = "PFIP backend — Personal Financial Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Suresh Sahoo", email = "suresh.sahoo@cbcinc.ai" },
]
license = { text = "MIT" }

dependencies = [
    # --- Web framework / API ---
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "starlette==0.37.2",
    "python-multipart==0.0.9",
    "sse-starlette==2.1.0",
    # --- Validation / settings ---
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "email-validator==2.1.2",
    # --- Auth ---
    "bcrypt==4.1.3",
    "pyjwt==2.8.0",
    "passlib[bcrypt]==1.7.4",
    # --- Database / ORM / migrations ---
    "sqlalchemy[asyncio]==2.0.30",
    "alembic==1.13.2",
    "psycopg[binary,pool]==3.2.1",
    "asyncpg==0.29.0",
    # --- Data / math / ML ---
    "pandas==2.2.2",
    "pandas-ta==0.3.14b0",
    "numpy==1.26.4",
    "pandera==0.19.3",
    "scikit-learn==1.5.0",
    # --- Market data ---
    "ccxt==4.3.55",
    "yfinance==0.2.40",
    # --- Orchestration ---
    "prefect==2.19.5",
    # --- Vector DB / LLM ---
    "qdrant-client==1.9.2",
    "httpx==0.27.0",
    # --- Knowledge base / RAG (Stage 3) ---
    "pypdf==4.3.1",
    "ebooklib==0.18",
    "beautifulsoup4==4.12.3",
    "langchain-text-splitters==0.2.2",
    # --- Observability ---
    "loguru==0.7.2",
    "sentry-sdk[fastapi]==2.7.1",
    # --- Redis ---
    "redis==5.0.7",
    # --- Utility ---
    "python-dateutil==2.9.0.post0",
    "orjson==3.10.6",
    "tenacity==8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "hypothesis==6.103.5",
    "httpx==0.27.0",
    "ruff==0.5.0",
    "black==24.4.2",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    "types-python-dateutil==2.9.0.20240316",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pfip"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.uv]
# uv uses this file as the source of truth for dependencies.
dev-dependencies = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "hypothesis==6.103.5",
    "httpx==0.27.0",
    "ruff==0.5.0",
    "black==24.4.2",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
]
